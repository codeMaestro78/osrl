[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:collector]
command=python -m osrl.daemon --db /data/telemetry.db
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/collector.log
stderr_logfile=/var/log/collector.log
priority=1

[program:dashboard]
command=streamlit run /app/osrl/dashboard/app.py
    --server.port 8501
    --server.address 0.0.0.0
    --server.headless true
    --browser.gatherUsageStats false
    --theme.base dark
    --theme.primaryColor #38bdf8
    --theme.backgroundColor #060d1a
    --theme.secondaryBackgroundColor #0a1628
    --theme.textColor #e2e8f0
directory=/app
environment=OSRL_DB="/data/telemetry.db"
autostart=true
autorestart=true
stdout_logfile=/var/log/dashboard.log
stderr_logfile=/var/log/dashboard.log
priority=2
