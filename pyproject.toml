[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrl-agent"
version = "0.1.0"
description = "Local RL watchdog for Ubuntu: PSI-based freeze risk detection, guarded interventions, Streamlit control plane."
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
osrl-collector = "osrl.daemon:main"
osrl-twin = "osrl.twin:main"

[tool.setuptools]
packages = ["osrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
