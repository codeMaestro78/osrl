[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrl-agent"
version = "0.1.0"
description = "Local RL watchdog for Ubuntu: PSI-based freeze risk detection, guarded interventions, Streamlit control plane."
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = [
    "streamlit>=1.50,<2",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
]
rl  = [
    "torch>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "streamlit>=1.35",
    "plotly>=5.20",
]


[project.scripts]
osrl-collector  = "osrl.daemon:main"
osrl-twin       = "osrl.twin:main"
osrl-train      = "osrl.rl.train:main"
osrl-auto-train = "osrl.rl.auto_train:main"
osrl-dashboard  = "osrl.dashboard._entrypoint:main"

[tool.setuptools]
packages = ["osrl", "osrl.rl", "osrl.dashboard", "osrl.dashboard.pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
